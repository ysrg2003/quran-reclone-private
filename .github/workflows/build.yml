name: build-release-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['*.md']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests
        run: gradle -q --no-daemon -Pkotlin.compiler.execution.strategy=in-process :app:testOnlineDebugUnitTest
      - name: Signed release APK
        env:
          KS_B64: ${{ secrets.RECLONE_KS_B64 }}
          RECLONE_KS_PASS: ${{ secrets.RECLONE_KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export RECLONE_KS="$RUNNER_TEMP/release.jks"
          gradle -q --no-daemon -Pkotlin.compiler.execution.strategy=in-process :app:assembleOnlineRelease \
            -x lintVitalOnlineRelease -x lintVitalAnalyzeOnlineRelease -x lintVitalReportOnlineRelease
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Verify signature and record hashes
        run: |
          APK=app/build/outputs/apk/online/release/app-online-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep -i 'sha-256'
          sha256sum "$APK"; ls -l "$APK"
          unzip -l "$APK" | awk '{print $4,$1}' | sort > filelist.txt
          mkdir dex && unzip -q -o "$APK" 'classes*.dex' -d dex && sha256sum dex/*.dex | tee dex-hashes.txt
          cp "$APK" app-online-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: quran-reclone-release
          path: |
            app-online-release.apk
            filelist.txt
            dex-hashes.txt
      - name: Test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build libwhisper_jni.so
        run: native/build.sh "$RUNNER_TEMP/wb" 79b11911d9d38c4be2fc7dc8b4efeff3324c090f
      - name: Compare with committed binary
        run: |
          B="$RUNNER_TEMP/wb/libwhisper_jni_stripped.so"; C=app/src/main/jniLibs/arm64-v8a/libwhisper_jni.so
          ls -l "$B" "$C"; sha256sum "$B" "$C"
          nm -D --defined-only "$B" | awk '{print $3}' | sort > new.sym
          nm -D --defined-only "$C" | awk '{print $3}' | sort > old.sym
          wc -l new.sym old.sym; diff old.sym new.sym && echo SYMBOLS_IDENTICAL || true
          cp "$B" libwhisper_jni_rebuilt.so
      - uses: actions/upload-artifact@v4
        with:
          name: libwhisper_jni-rebuilt
          path: |
            libwhisper_jni_rebuilt.so
            new.sym
            old.sym
